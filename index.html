<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tournament Header Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Silkscreen&display=swap" rel="stylesheet">
<style>
  :root { --page: #EDF0F3; --text: #1A2230; --muted: #5B6676; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #10151D; --text: #E6EBF2; --muted: #94A0B2; } }
  :root[data-theme="dark"] { --page: #10151D; --text: #E6EBF2; --muted: #94A0B2; }
  body { margin: 0; background: var(--page); color: var(--text); font-family: 'Bricolage Grotesque', system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.note { color: var(--muted); font-size: 14px; margin: 0 0 18px; line-height: 1.5; }
  .label { font-size: 12px; color: var(--muted); margin: 18px 0 6px; text-transform: uppercase; letter-spacing: .06em; }
  .frame { border-radius: 10px; overflow: hidden; border: 1px solid #2a3444; }

  /* ---- copied from the app, unchanged ---- */
  .ps-root { --paper:#EDF0F3; --card:#FFFFFF; --ink:#1A2230; --muted:#5B6676; --line:#D5DBE3; --accent:#0F766E;
             font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif; color: var(--ink); }
  .ps-root.dark { --paper:#10151D; --card:#18202B; --ink:#E6EBF2; --muted:#94A0B2; --line:#2A3444; --accent:#2DD4BF; }
  .ps-top { display:flex; align-items:center; flex-wrap:wrap; gap:10px 14px; padding:12px 22px; border-bottom:1px solid var(--line); background:var(--card); }
  .ps-spacer { flex: 1; }
  .ps-logo { display:flex; align-items:center; gap:9px; font-family:inherit; font-weight:800; font-size:22px; letter-spacing:-.03em; background:none; border:0; padding:0; color:inherit; cursor:pointer; line-height:1 }
  .ps-logo-mark { width:26px; height:auto; display:block; flex:0 0 auto }
  .ps-logo-word { display:inline-flex; align-items:baseline }
  .ps-logo:hover .ps-logo-word { color:var(--accent) }
  .ps-logo-sub { font-weight:400; font-size:23px; margin-left:.28em }
  /* ---- end of the app's logo ---- */

  .fake-search { border:1px solid var(--line); border-radius:8px; padding:8px 12px; font-size:14px; color:var(--muted); min-width:180px; }
  .fake-btn { border:1px solid var(--line); border-radius:8px; padding:8px 12px; font-size:14px; }

  /* ---- the tournament dressing: sits around the logo, never inside it ---- */
  .t-wrap { position: relative; display: inline-grid; grid-template-columns: auto; padding-left: 34px; }
  .t-logo { position: relative; display: inline-flex; align-items: center; }
  .t-left { position: absolute; left: -2px; top: -6px; width: 32px; height: 36px; pointer-events: none; }
  .t-right { position: relative; display: inline-block; width: 46px; height: 28px; margin-left: 8px; pointer-events: none; }
  .t-left svg, .t-right svg { position: absolute; display: block; }
  .t-gem    { left: 2px;  top: 2px; }
  .t-sword  { left: 8px;  top: 10px; }
  .t-trophy { left: 0;    top: 2px; }
  .t-spark.s1 { left: 22px; top: -2px; }
  .t-spark.s2 { left: -4px; top: 26px; }
  .t-spark.s3 { left: 26px; top: -4px; }
  .t-spark.s4 { left: 32px; top: 12px; }
  .t-spark.s5 { left: 22px; top: 24px; }
  .t-sub { display: flex; align-items: center; gap: 7px; margin: 4px 0 0 35px;
            font-family: 'Silkscreen', ui-monospace, monospace; font-size: 10px; letter-spacing: .14em;
            text-transform: uppercase; color: var(--muted); line-height: 1; white-space: nowrap; }
  .t-spark.inline { position: static; }
  /* light mode: deepen the gold and edge the blade so they read on white */
  .ps-root:not(.dark) .t-spark rect[fill="#f6c343"] { fill: #E0A100; }
  .ps-root:not(.dark) .t-sword rect[fill="#ffffff"] { fill: #9AA6B4; }

  /* Only opacity and transform move - the cheapest things a browser can animate. */
  .t-spark { animation: t-twinkle 1.9s ease-in-out infinite; transform-origin: center; }
  .t-spark.s2 { animation-delay: .5s; } .t-spark.s3 { animation-delay: .9s; }
  .t-spark.s4 { animation-delay: .25s; } .t-spark.s5 { animation-delay: 1.3s; }
  .t-spark.s6 { animation-delay: .7s; } .t-spark.s7 { animation-delay: 1.1s; }
  @keyframes t-twinkle { 0%,100% { opacity:.25; transform:scale(.55); } 50% { opacity:1; transform:scale(1); } }

  .t-gem { animation: t-float 2.6s ease-in-out infinite alternate; }
  @keyframes t-float { from { transform: translateY(0); } to { transform: translateY(-2px); } }

  .t-glint { animation: t-glint 2.4s ease-in-out infinite; }
  @keyframes t-glint { 0% { transform: translate(0,0); opacity:0; } 15% { opacity:1; }
                         55% { transform: translate(5px,-5px); opacity:1; } 70%,100% { transform: translate(6px,-6px); opacity:0; } }

  .t-trophy { animation: t-bob 3.2s ease-in-out infinite; }
  @keyframes t-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-1px); } }
  .t-shine { animation: t-shine 3.2s ease-in-out infinite; }
  @keyframes t-shine { 0%,55% { transform: translateX(-2px); } 85%,100% { transform: translateX(13px); } }

  /* Anyone who has asked their computer for less motion gets a still header. */
  @media (prefers-reduced-motion: reduce) {
    .t-spark, .t-gem, .t-glint, .t-trophy, .t-shine { animation: none; }
    .t-spark { opacity: .8; }
  }
  @media (max-width: 560px) { .fake-search { display:none; } }
</style></head>
