<script>
/* Projeclab — Word Summary tool (Volk English)
   mountWordSummary(rootEl) renders the whole tool inside rootEl.
   Animation is a frame-accurate copy of the reference "word_summary" clip (24 fps, 108 frames). */
(function () {
  'use strict';

  // ---------- Layout (1080p units; 4K = x2) ----------
  var L = {
    W: 1920, H: 1080,
    IMG: { x: 1109, y: 71, w: 568, h: 379 },
    TITLE: { x: 1094, base: 575, size: 120, track: -0.03, maxW: 730, weight: 700 },
    DEF: { x: 1092, base: 652.5, size: 34, track: -0.04, lineH: 43, maxW: 720 }
  };
  var BASE_FRAMES = 108;          // 4.5 s at 24 fps, same as the reference
  var HOLD_AT = 40;               // frames after this are shifted when the hold is lengthened/shortened
  var BLUR0 = 5;                  // title blur (px @1080p) on its first frame
  // Title fly-out: [frame, dx, dy, scale] measured from the reference, relative to the title centre
  var FLY = [[76,0,0,1],[77,8.5,6,.997],[78,19.5,13.5,.997],[79,30,21.5,.993],[80,42,29.5,.987],[81,53.5,38,.983],[82,66,47.5,.974],[83,79,57,.967],[84,92,67.5,.954],[85,106,78,.94],[86,120.5,89.5,.924],[87,136,102,.901],[88,152,116,.874],[89,169.5,130.5,.844],[90,188.5,147.5,.811],[91,209,166,.768],[92,231.5,187.5,.712],[93,258,212.5,.642],[94,289.5,243.5,.553],[95,329,284.5,.424],[96,381,340,.238],[97,441,402,0]];
  var FONT = 'InterWS';

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

  // Map an output frame number (1-based, 24 fps) to the reference timeline, adding/removing hold time.
  function refFrame(n, extra) {
    if (n <= HOLD_AT) return n;
    var m = n - extra;
    return m < HOLD_AT ? HOLD_AT : m;
  }

  // All animated values for a reference frame n (can be fractional for preview).
  function stateAt(n) {
    var s = { img: n >= 2 && n < 81, imgOp: n > 74 ? clamp((81 - n) / 7, 0, 1) : 1, title: n >= 2 && n < 97, blur: 0, dx: 0, dy: 0, sc: 1, dOp: 0, dY: 0 };
    if (n >= 2 && n < 8.5) s.blur = BLUR0 * (8.5 - n) / 6.5;
    if (n > 76) {
      for (var i = 0; i < FLY.length - 1; i++) {
        var a = FLY[i], b = FLY[i + 1];
        if (n >= a[0] && n <= b[0]) {
          var t = (n - a[0]) / (b[0] - a[0]);
          s.dx = a[1] + (b[1] - a[1]) * t; s.dy = a[2] + (b[2] - a[2]) * t; s.sc = a[3] + (b[3] - a[3]) * t;
          break;
        }
      }
      if (n >= 97) s.title = false;
    }
    // definition: fade + rise in, sink + fade out
    if (n >= 2) {
      var op = clamp((n - 2.7) / 6.6, 0, 1);
      var p = clamp((n - 2) / 22, 0, 1);
      var y = 28 * Math.pow(1 - p, 3);
      if (n > 61) y += 0.0623 * (n - 61) * (n - 61);
      if (n > 73.5) op *= clamp((79.8 - n) / 6.3, 0, 1);
      s.dOp = op; s.dY = y;
    }
    return s;
  }

  function sigOf(s) {
    return [s.img, s.imgOp.toFixed(3), s.title, s.blur.toFixed(2), s.dx.toFixed(2), s.dy.toFixed(2), s.sc.toFixed(3), s.dOp.toFixed(3), s.dY.toFixed(2)].join('|');
  }

  function setTrack(ctx, px) { if ('letterSpacing' in ctx) ctx.letterSpacing = px + 'px'; }

  function wrapLines(ctx, text, maxW) {
    var out = [];
    String(text || '').split(/\n/).forEach(function (para) {
      var words = para.split(/\s+/).filter(Boolean), line = '';
      words.forEach(function (w) {
        var test = line ? line + ' ' + w : w;
        if (line && ctx.measureText(test).width > maxW) { out.push(line); line = w; } else line = test;
      });
      out.push(line);
    });
    return out;
  }

  // Draw one frame. ctx canvas is W*S x H*S. item = {word, def, img, crop:{x,y,z}, defWeight}
  function drawFrame(ctx, item, s, S) {
    ctx.save();
    ctx.setTransform(S, 0, 0, S, 0, 0);
    ctx.clearRect(0, 0, L.W, L.H);
    // Photo
    if (s.img && item.img) {
      var B = L.IMG, im = item.img, c = item.crop || { x: .5, y: .5, z: 1 };
      var iw = im.naturalWidth || im.width, ih = im.naturalHeight || im.height;
      var sc = Math.max(B.w / iw, B.h / ih) * (c.z || 1);

.ps-act-find{width:100%;max-width:360px;box-sizing:border-box;margin:0 0 10px}
.ps-actlist{display:flex;flex-direction:column}
.ps-actrow{display:grid;grid-template-columns:132px 92px minmax(0,1.1fr) minmax(0,1.4fr) 86px;align-items:center;gap:12px;padding:7px 4px;border-bottom:1px solid var(--line);font-size:13px}
.ps-act-at{font-size:12px;white-space:nowrap}
.ps-act-who{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ps-act-title{border:0;background:none;padding:0;font:inherit;font-weight:600;color:var(--accent);text-align:left;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ps-act-title:hover{text-decoration:underline}
.ps-act-what{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ps-act-undo{justify-self:end;white-space:nowrap}
.ps-act-undo:disabled{opacity:.38;cursor:default}
@media (max-width:820px){
  .ps-actrow{grid-template-columns:minmax(0,1fr) 86px;row-gap:2px}
  .ps-act-at{grid-column:1}
  .ps-act-who{grid-column:1}
  .ps-act-title{grid-column:1}
  .ps-act-what{grid-column:1}
  .ps-act-undo{grid-column:2;grid-row:1 / span 4;align-self:center}
}
.ps-bellwrap{position:relative;display:inline-flex}
.ps-bell{position:relative;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;width:34px;height:34px;padding:0;cursor:pointer}
.ps-bell.on{color:var(--accent)}
.ps-bell-i{display:block}
.ps-bell:hover{border-color:var(--accent)}
.ps-bell-n{position:absolute;top:-6px;right:-6px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--late);color:#fff;font-size:11px;font-weight:700;line-height:17px;text-align:center}
.ps-bellpanel{position:absolute;top:calc(100% + 6px);right:0;width:330px;max-width:82vw;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 18px 40px -12px rgba(0,0,0,.35);z-index:50;padding:10px 12px 8px}
.ps-bell-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:14px}
.ps-bell-head b{flex:1;min-width:0;white-space:nowrap}
.ps-bell-head{flex-wrap:wrap;row-gap:8px}
.ps-bell-head::after{content:"";order:2;flex-basis:100%;height:0}
.ps-bell-head > .ps-btn{order:3}
.ps-bell-head > .ps-btn:first-of-type{margin-left:auto}
.ps-soundbtn{display:inline-flex;align-items:center;gap:5px;flex:0 0 auto;background:none;border:1px solid var(--line);border-radius:999px;padding:3px 9px 3px 7px;font:inherit;font-size:12px;color:var(--muted);cursor:pointer}
.ps-soundbtn.on{color:var(--accent);border-color:var(--accent)}
.ps-soundbtn:hover{background:var(--paper)}
.ps-bell-none{font-size:13px;margin:4px 0 6px;line-height:1.5}
.ps-belllist{display:flex;flex-direction:column;max-height:330px;overflow-y:auto;overscroll-behavior:contain}
.ps-bellrow{display:flex;align-items:flex-start;gap:6px;border-bottom:1px solid var(--line)}
.ps-bellrow:last-child{border-bottom:0}
.ps-bell-go{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;border:0;background:none;padding:8px 0;font:inherit;color:var(--ink);text-align:left;cursor:pointer;border-radius:6px}
.ps-bell-go:hover .ps-bell-t{color:var(--accent)}
.ps-bell-t{font-size:13px;line-height:1.4;font-weight:600}
.ps-bell-m{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ps-bellrow .ps-x-small{align-self:center;flex:0 0 auto}
.ps-linkout{display:inline-block;max-width:100%;padding:7px 0;font-size:14px;color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ps-linkout:hover{text-decoration:underline}
.ps-brief{display:flex;flex-direction:column;gap:6px;max-width:760px;margin-bottom:12px}
.ps-briefnote{border:1px solid var(--line);border-radius:9px;padding:9px 13px;background:var(--card)}
.ps-tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-bottom:30px}
.ps-tool{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--card);display:flex;flex-direction:column;gap:6px}
.ps-tool.off{opacity:.7}
.ps-tool-t{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.ps-tool-n{margin:0;font-size:13px}
.ps-tool-m{margin:0;font-size:12.5px}
.ps-tool .ps-tool-b{justify-content:flex-start;gap:8px;margin-top:4px}
.ps-ws-overlay{padding:20px 12px;z-index:40}
.ps-ws-modal{position:relative;width:100%;max-width:1520px;border-radius:14px;overflow:hidden;background:#0f1115;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.ps-ws-x{color:#8b93a5;z-index:2}
.ps-ws-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 56px 12px 18px;border-bottom:1px solid #262b36;background:#141821;font:14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#e9ecf2}
.ps-ws-l{font-size:12px;color:#8b93a5;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.ps-ws-sel,.ps-ws-name{font:inherit;color:#e9ecf2;background:#0b0d11;border:1px solid #262b36;border-radius:7px;padding:6px 8px}
.ps-ws-sel{max-width:260px}
.ps-ws-name{min-width:200px;flex:1 1 200px;max-width:340px;font-weight:600}
.ps-ws-name:focus{border-color:#f5b041;outline:0}
.ps-ws-btn{font:inherit;border:1px solid #262b36;background:#20242e;color:#e9ecf2;border-radius:8px;padding:6px 11px;cursor:pointer}
.ps-ws-btn:hover{border-color:#3a4252}
.ps-ws-btn.danger{color:#ff8a80}
.ps-ws-saved{font-size:12px;color:#8b93a5;margin-left:auto}
.ps-ws-bar .ps-ws-x{top:10px}
.ps-root .ws input,.ps-root .ws select,.ps-root .ws textarea,.ps-root .ps-ws-bar select,.ps-root .ps-ws-bar input{background:#0b0d11;color:#e9ecf2;border:1px solid #262b36;border-radius:7px;padding:6px 8px}
.ps-root .ws input[type=range]{background:none;border:0;padding:0}
.ps-root .ps-ws-bar input.ps-ws-name:focus{border-color:#f5b041}
.ps-briefnote>summary{display:flex;align-items:baseline;gap:10px;cursor:pointer;list-style:none;font-weight:600;font-size:14px}
.ps-briefnote>summary::-webkit-details-marker{display:none}
.ps-briefnote>summary::before{content:"\u25B8";color:var(--muted);font-size:11px;transition:transform .12s;display:inline-block}
.ps-briefnote[open]>summary::before{transform:rotate(90deg)}
.ps-brief-t{flex:1;min-width:0}
.ps-brief-at{font-size:12px;font-weight:400}
.ps-brief-body{margin:8px 0 6px;font-size:14px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.ps-briefnote .ps-btnrow{justify-content:flex-start;gap:8px;margin-top:2px}
.ps-brief-edit textarea{width:100%;min-height:110px;resize:vertical;line-height:1.5;margin:8px 0 6px}
.ps-briefadd{display:flex;flex-direction:column;gap:8px;max-width:760px;margin-bottom:8px}
.ps-briefadd textarea{min-height:88px;resize:vertical;line-height:1.5}
.ps-briefadd .ps-btn{align-self:flex-start}
.ps-hrbars{display:flex;flex-direction:column;max-width:900px;margin:2px 0 10px}
.ps-hrrow{display:grid;grid-template-columns:minmax(0,150px) 96px minmax(0,1fr);align-items:center;gap:14px;width:100%;padding:9px 6px;border:0;border-bottom:1px solid var(--line);background:none;font:inherit;color:var(--ink);text-align:left;cursor:pointer;border-radius:6px}
.ps-hrrow:hover{background:var(--paper)}
.ps-hr-name{display:flex;flex-direction:column;min-width:0;font-size:13.5px;font-weight:600;overflow:hidden}
.ps-hr-role{font-size:11.5px;font-weight:400}
.ps-hr-val{text-align:right;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.ps-hr-unit{font-size:11.5px;font-weight:400}
.ps-hr-track{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.ps-hr-fill{display:block;height:100%;border-radius:5px;background:var(--accent)}
@media (max-width:640px){
  .ps-hrrow{grid-template-columns:minmax(0,1fr) 92px;row-gap:6px}
  .ps-hr-track{grid-column:1 / -1}
}
.ps-weekhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;max-width:900px}
.ps-weeknav{display:flex;align-items:center;gap:8px}
.ps-weekspan{font-size:13px;min-width:104px;text-align:center}
.ps-agecols{display:flex;align-items:flex-end;gap:8px;max-width:900px;margin:4px 0 10px;padding-bottom:2px;border-bottom:1px solid var(--line)}
.ps-agecol{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px;padding:4px 2px 8px;border:0;background:none;font:inherit;color:var(--ink);cursor:pointer;border-radius:6px 6px 0 0}
.ps-agecol:hover{background:var(--paper)}
.ps-agecol-n{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}
.ps-agecol.late .ps-agecol-n{color:var(--late)}
.ps-agecol-plot{display:flex;align-items:flex-end;justify-content:center;width:100%;height:170px}
.ps-agecol-bar{display:block;width:60%;max-width:34px;min-height:4px;border-radius:4px 4px 0 0;background:var(--accent)}
.ps-agecol.late .ps-agecol-bar{background:var(--late)}
.ps-agecol-name{font-size:11px;line-height:1.3;font-weight:600;text-align:center;width:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ps-agecol-who{font-size:10.5px;color:var(--muted);text-align:center;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:900px){
  .ps-agecols{overflow-x:auto;padding-bottom:6px}
  .ps-agecol{flex:0 0 78px}
}
.ps-rowtag{display:inline-block;margin-right:7px;padding:1px 6px;border-radius:5px;background:var(--line);color:var(--muted);font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;vertical-align:1px}
.ps-root .ps-comment-editbtn{background:none;border:0;padding:0 0 0 8px;font-size:12px;color:var(--muted);cursor:pointer;text-decoration:underline}
.ps-root .ps-comment-editbtn:hover{color:var(--accent)}
.ps-comment-edited{font-size:12px}
.ps-comment-edit{margin-top:4px}
.ps-comments{margin:16px 0 4px;padding-top:14px;border-top:1px solid var(--line)}
.ps-photos{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.ps-photo{position:relative;display:block;line-height:0}
.ps-photo img{width:104px;height:78px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--paper);display:block}
.ps-photo a:focus-visible img{outline:2px solid var(--accent);outline-offset:2px}
.ps-photo-x{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--muted);font:inherit;font-size:13px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
.ps-photo-x:hover{color:var(--late);border-color:var(--late)}
.ps-photo-add{display:inline-flex;align-items:center;cursor:pointer;flex:0 0 auto}
.ps-photo-add.busy{opacity:.6;cursor:progress}
.ps-taskpics{margin:14px 0 4px}
.ps-who-chip{position:relative;cursor:pointer;transition:border-color .12s}
.ps-who-chip:hover,.ps-who-chip:focus-within{border-color:var(--accent)}
.ps-who-caret{font-size:11px;color:var(--muted);margin-left:1px}
.ps-who-select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font:inherit;border:0}
.ps-brief-edit-btn{margin-left:10px;vertical-align:middle}
.ps-brief-in{width:100%;box-sizing:border-box;min-height:120px;resize:vertical;line-height:1.5;margin:8px 0 6px}
.ps-notebox .ps-btnrow{justify-content:flex-end;align-items:center;gap:8px}
.ps-notebox .ps-counter{margin-right:auto;align-self:center}
.ps-taskpics-h{display:block;font-size:14px;margin-bottom:2px}
.ps-taskpics-note{font-size:12px;margin:6px 0 0}
.ps-comments-h{display:block;font-size:14px;margin-bottom:8px}
.ps-comments-none{font-size:13px;margin:0 0 8px}
.ps-comment{display:flex;gap:9px;padding:7px 0}
.ps-comment-body{min-width:0;flex:1}
.ps-comment-who{font-size:13px;font-weight:600}
.ps-comment-at{font-weight:400;font-size:12px;margin-left:8px}
.ps-comment-text{margin:2px 0 0;font-size:14px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.ps-comment.ask .ps-comment-text{border-left:3px solid var(--warn);padding-left:9px}
.ps-comment.answer .ps-comment-text{border-left:3px solid var(--accent);padding-left:9px}
.ps-comment-in{width:100%;min-height:62px;resize:vertical;line-height:1.45;margin-top:6px}
.ps-tgroup{border-bottom:0}
.ps-tgroup > summary{display:flex;align-items:center;gap:10px;cursor:pointer;list-style:none;padding:10px 0 6px;font-weight:600;font-size:14px;color:var(--ink)}
.ps-tgroup > summary::-webkit-details-marker{display:none}
.ps-tgroup > summary::before{content:"▸";color:var(--muted);font-size:11px;transition:transform .12s;display:inline-block}
.ps-tgroup[open] > summary::before{transform:rotate(90deg)}
.ps-tgroup > summary:hover .ps-tgroup-name{color:var(--accent)}
.ps-tgroup-n{color:var(--muted);font-weight:500;font-size:13px}
.ps-tgroup.overdue .ps-tgroup-n{color:var(--late);font-weight:600}
.ps-tgroup.done > summary{color:var(--muted)}
.ps-todo{display:flex;align-items:center;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.ps-todo{align-items:flex-start}
.ps-todo input[type=checkbox]{margin-top:2px}
.ps-todo.done .ps-todo-text{text-decoration:line-through;color:var(--muted)}
.ps-todo input[type=checkbox],.ps-checks input{width:17px;height:17px;accent-color:var(--accent)}
.ps-undo{background:none;border:1px solid var(--line);border-radius:6px;padding:2px 10px;font-size:13px;font-weight:600;color:var(--accent);cursor:pointer}
.ps-undo:hover{border-color:var(--accent)}
.ps-todo.removed{color:var(--muted);font-size:14px}
.ps-todo.removed span{flex:1}
.ps-x-small{background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer;line-height:1;padding:0 4px}
.ps-x-small:hover{color:var(--late)}
.ps-overlay{position:fixed;inset:0;background:rgba(10,14,20,.5);display:flex;align-items:flex-start;justify-content:center;padding:48px 16px;overflow:auto;z-index:20}
.ps-modal{position:relative;background:var(--card);border-radius:12px;padding:28px 30px;width:100%;max-width:680px;box-shadow:0 30px 60px -20px rgba(0,0,0,.4)}
.ps-x{position:absolute;top:14px;right:16px;background:none;border:0;font-size:26px;cursor:pointer;color:var(--muted)}
.ps-bigcal-head{max-width:none;margin-bottom:10px;gap:10px;justify-content:flex-start}
.ps-bigcal-title{font-size:18px}
.ps-today-btn{margin-left:auto;padding:4px 12px}
.ps-bigcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.ps-bigcal-dow{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
.ps-bigcal-blank{min-height:92px;border-radius:9px;background:transparent}
.ps-bigcal-day{display:flex;flex-direction:column;gap:2px;align-items:stretch;min-height:92px;padding:5px 6px;background:var(--card);border:1px solid var(--line);border-radius:9px;cursor:pointer;font:inherit;color:var(--ink);text-align:left;overflow:hidden}
.ps-bigcal-day:hover{border-color:var(--accent)}
.ps-bigcal-day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.ps-bigcal-num{font-size:12px;font-weight:700;color:var(--muted)}
.ps-bigcal-day.today .ps-bigcal-num{color:var(--accent)}
.ps-ev{font-size:10.5px;line-height:1.3;padding:1px 5px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps-ev.off{background:var(--warnbg);color:var(--warn)}
.ps-ev.meet{background:var(--okbg);color:var(--accent);font-weight:600}
.ps-ev.more{color:var(--muted)}
.ps-ev.event{background:#EDE4FF;color:#5B2DB8;font-weight:600}
.ps-root.dark .ps-ev.event{background:#2E2250;color:#C9B2FF}
.ps-away-row.ps-event-row{background:#F4EEFF;border-color:#D9C8FF}
.ps-root.dark .ps-away-row.ps-event-row{background:#241B3D;border-color:#3D2E66}
.ps-day-kind{display:inline-flex;gap:4px;margin:12px 0 0;padding:3px;border-radius:10px;background:var(--paper);border:1px solid var(--line)}
.ps-day-kind .ps-seg-btn{border:0;background:none;padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--muted)}
.ps-day-kind .ps-seg-btn.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ps-day-check{display:inline-flex;align-items:center;gap:6px;font-size:14px;white-space:nowrap;cursor:pointer}
.ps-day-whole{display:flex;align-items:center;height:100%;min-height:40px;padding:0 12px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-weight:600}
.ps-day-title{flex:1 1 200px;min-width:0}
.ps-day-until{margin-top:0}
.ps-who-all{font-weight:700}
.ps-day-form .ps-duo.ps-day-time{flex:0 0 165px;min-width:165px}
.ps-day-form .ps-duo.ps-day-time .ps-pickerwrap{flex:1 1 auto;min-width:0}

.ps-day-form{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0 6px}
.ps-day-form input,.ps-day-form select{flex:1 1 150px;min-width:0}
.ps-day-time{flex:0 0 130px}
.ps-who-pick{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.ps-who{border:1px solid var(--line);background:var(--paper);color:var(--muted);font:inherit;font-size:12px;padding:3px 9px;border-radius:999px;cursor:pointer}
.ps-who.on{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600}
.ps-hr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px;margin-bottom:20px}
.ps-hr-card{display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;cursor:pointer;font:inherit;color:var(--ink)}
.ps-hr-card:hover{border-color:var(--accent)}
.ps-hr-main{display:flex;flex-direction:column;min-width:0;flex:1}

.ps-hr-chips{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.ps-hr-chips .ps-chip{font-size:11px;padding:1px 7px}
.ps-person-head{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.ps-person-head .ps-h2{margin:0 0 2px}
.ps-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.ps-tab{border:0;background:none;color:var(--muted);font:inherit;font-weight:600;padding:7px 11px;border-radius:8px 8px 0 0;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}

.ps-allow-sum{display:flex;flex-direction:column;gap:1px;font-size:13px;padding-bottom:2px}
.ps-balance{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 14px}

.ps-bal-n{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--accent)}

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;
/* ================================================================
   STEP: paste your two Supabase values between the quotes below.
   Find them in Supabase: Project Settings → API.

const SUPABASE_URL = "https://yuetvdhfbxnmrfdmnsod.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_E2cTTgTNiMP-rOhAm6tSyw_IhenR-Q0";

const CONFIGURED = SUPABASE_URL.startsWith("https://") && !SUPABASE_ANON_KEY.startsWith("PASTE");
const sb = CONFIGURED ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

/* Shared saving: everyone reads and writes the same row in Supabase */
if (sb) {
  window.storage = {
    get: async key => {
      const { data, error } = await sb.from("app_state").select("value, updated_at").eq("key", key).maybeSingle();
      if (error) throw error;
      return data ? { key, value: data.value, at: data.updated_at } : null;
    },
    set: async (key, value, _shared, expectAt) => {
      const at = new Date();
      /* Remembered so our own save echoing back over the live channel can be
         recognised - we already have that data, no need to download it again. */
      window.__psLastWrite = at.getTime();
      /* Only write if nobody saved since we read (compare the saved-at stamp).
         If someone did, say so - the app merges their work in and tries again. */
      if (expectAt) {
        const { data, error: e2 } = await sb.from("app_state")
          .update({ value, updated_at: at.toISOString() })
          .eq("key", key).eq("updated_at", expectAt).select("key");
        if (e2) throw e2;
        if (!data || !data.length) { const c = new Error("Someone saved at the same moment"); c.conflict = true; throw c; }
        return { key, value };
      }
      const { error } = await sb.from("app_state").upsert({ key, value, updated_at: at.toISOString() });
      if (error) throw error;
      return { key, value };
    },
    subscribe: (key, cb) => {
      let lastPull = Date.now();
      const refresh = async () => {
        lastPull = Date.now();
        try { const r = await window.storage.get(key); if (r) cb(r.value); } catch (e) { console.error(e); }
      };
      const ch = sb.channel("app_state_changes")
        .on("postgres_changes", { event: "*", schema: "public", table: "app_state" }, p => {
          if (p.new && p.new.key !== undefined && p.new.key !== key) return;
          /* Our own save coming back to us: skip the 252 KB re-download. */
          if (p.new && p.new.updated_at && new Date(p.new.updated_at).getTime() === window.__psLastWrite) return;
          refresh();
        })
        .subscribe();
      /* Coming back to the tab catches up, but at most once a minute - not on
         every alt-tab. */
      const onFocus = () => { if (Date.now() - lastPull > 60000) refresh(); };
      window.addEventListener("focus", onFocus);
      /* Live updates carry every change as it happens. This slow check is only a
         safety net for a dropped connection - it used to run every 30 seconds
         in every open tab. */
      const timer = setInterval(refresh, 5 * 60 * 1000);
      return () => { sb.removeChannel(ch); window.removeEventListener("focus", onFocus); clearInterval(timer); };
    },
  };

    const ext = (String(file.type).split("/")[1] || "jpg").replace("jpeg", "jpg").replace(/[^a-z0-9]/gi, "");

    live: true,
    can: async () => {
      const { data, error } = await sb.rpc("is_payroll_admin");
      if (error) return { ok: false, setup: /function|does not exist|schema cache/i.test(error.message || "") ? "missing" : "error" };
      return { ok: data === true };
    },
    list: async () => {
      const { data, error } = await sb.from("payroll").select("id, kind, data, updated_at, updated_by");
      if (error) throw error;
      return data || [];
    },
    save: async (id, kind, data) => {
      const { data: u } = await sb.auth.getUser();
      const { error } = await sb.from("payroll").upsert({ id, kind, data, updated_at: new Date().toISOString(), updated_by: (u && u.user && u.user.email) || null });
      if (error) throw error;
    },
    remove: async (id) => {
      const { error } = await sb.from("payroll").delete().eq("id", id);
      if (error) throw error;
    }
  };
}

const GATE_CSS = `
.gt{font-family:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;background:#EDF0F3;color:#1A2230;padding:20px}
.gt-box{background:#fff;border:1px solid #D5DBE3;border-radius:12px;padding:32px;max-width:420px;width:100%}
.gt h1{font-size:30px;font-weight:800;letter-spacing:-.03em;margin:0 0 6px}
.gt p{color:#5B6676;margin:0 0 16px;line-height:1.5}
.gt input{width:100%;box-sizing:border-box;font:inherit;padding:10px 12px;border:1px solid #D5DBE3;border-radius:8px;margin-bottom:10px}
.gt button{width:100%;font:inherit;font-weight:600;background:#0F766E;color:#fff;border:0;border-radius:8px;padding:10px;cursor:pointer}
.gt button.link{background:none;color:#0F766E;width:auto;padding:0;margin-top:12px}
.gt button:disabled{opacity:.5}
.gt .err{color:#B42318}
.gt code{background:#EDF0F3;padding:2px 6px;border-radius:4px}
`;

function Gate() {
  const [session, setSession] = useState(undefined);
  const [allowed, setAllowed] = useState(null);
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [slow, setSlow] = useState(false);

  useEffect(() => {
    const t = setTimeout(() => setSlow(true), 8000);
    return () => clearTimeout(t);
  }, []);

  useEffect(() => {
    if (!sb) return;
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data } = sb.auth.onAuthStateChange((_event, s) => setSession(s));
    return () => data.subscription.unsubscribe();
  }, []);
  /* Check the team list once per signed-in person - not every time Supabase
     quietly renews the login (it does that when you come back to the tab).
     Re-checking then flashed "Loading..." and threw away anything half-typed. */
  const userId = session && session.user ? session.user.id : null;
  useEffect(() => {
    if (!sb || !userId) { setAllowed(null); return; }
    sb.rpc("is_team_member").then(({ data, error }) => {
      if (error) setAllowed((was) => was === true ? true : false);
      else setAllowed(data === true);
    });
  }, [userId]);

  const signOut = async () => { await sb.auth.signOut(); window.cutlineAuth = null; setPassword(""); };
  const send = async () => {
    setErr("");
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email.trim())) { setErr("Type a full email address, like name@company.com."); return; }
    if (!password) { setErr("Type your password."); return; }
    setBusy(true);
    const { error } = await sb.auth.signInWithPassword({ email: email.trim().toLowerCase(), password });
    setBusy(false);
    if (error) {
      const m = (error.message || "").toLowerCase();
      if (m.includes("invalid login")) setErr("That email and password don't match. Check for typos, or ask your team lead to reset it.");
      else if (m.includes("confirm")) setErr("This account hasn't been confirmed yet. Ask your team lead to tick 'Auto Confirm User' in Supabase.");
      else setErr(error.message);
    }
  };

  const box = children => <div className="gt"><style>{GATE_CSS}</style><div className="gt-box">{children}</div></div>;

  if (!sb) return box(<><h1>Almost there</h1><p>Open <code>index.html</code> and paste your Supabase Project URL and anon public key near the top of the file.</p></>);
  if (session === undefined || (session && allowed === null)) return box(
    <><p>Loading…</p>
      {slow && <>
        <p className="err">This is taking longer than usual. Supabase may be unreachable,
          or another tab of Projeclab Studios is holding the sign-in.</p>
        <button onClick={() => window.location.reload()}>Try again</button>
      </>}
    </>);
  if (!session) return box(
    <><h1>Projeclab Studios</h1><p>Sign in with your work email and password.</p>
      <input type="email" placeholder="you@company.com" value={email} onChange={e => setEmail(e.target.value)}
        onKeyDown={e => e.key === "Enter" && send()} autoFocus />
      <input type="password" placeholder="Password" value={password} onChange={e => setPassword(e.target.value)}
        onKeyDown={e => e.key === "Enter" && send()} />
      <button onClick={send} disabled={busy}>{busy ? "Signing in…" : "Sign in"}</button>
      {err && <p className="err" style={{ marginTop: 10 }}>{err}</p>}
      <p style={{ marginTop: 14, fontSize: 13 }}>Forgotten it? Ask your team lead to set a new one for you in Supabase.</p></>
  );
  if (!allowed) return box(<><h1>Not on the team list</h1><p><b>{session.user.email}</b> isn't allowed in yet. Ask your team lead to add this email in Supabase.</p>
    <button onClick={signOut}>Sign out</button></>);

  window.cutlineAuth = { email: session.user.email, signOut };
  return <><ProjeclabStudios /><OpeningSweep /></>;
}

/* Opening transition, modeled on the "layers" reference: every visible piece of the
   screen (panels, nav items, titles, chart, table rows...) fades in on its own,
   staggered top-left to bottom-right. Plays once each time the app opens. */
function OpeningSweep() {
  const [phase, setPhase] = React.useState("wait"); // wait -> gone -> done
  React.useEffect(() => {
    let cancelled = false, tries = 0;
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const finish = () => { if (cancelled) return; setPhase("gone"); setTimeout(() => !cancelled && setPhase("done"), 250); };
    const LEAF = { SVG: 1, IMG: 1, BUTTON: 1, INPUT: 1, SELECT: 1, TEXTAREA: 1, CANVAS: 1, VIDEO: 1 };
    const isLayer = (el, cs) => {
      if (LEAF[el.tagName.toUpperCase()]) return true;
      if (cs.backgroundImage !== "none" || cs.boxShadow !== "none") return true;
      const bg = cs.backgroundColor;
      if (bg && bg !== "transparent" && !/rgba\(.*,\s*0\)$/.test(bg)) return true;
      if (parseFloat(cs.borderTopWidth) > 0 || parseFloat(cs.borderBottomWidth) > 0 || parseFloat(cs.borderLeftWidth) > 0) return true;
      for (const n of el.childNodes) if (n.nodeType === 3 && n.nodeValue.trim()) return true;
      return false;
    };
    const run = (root) => {
      const vw = window.innerWidth, vh = window.innerHeight, picked = [];
      const walk = (el) => {
        if (picked.length > 450) return;
        const r = el.getBoundingClientRect();
        if (r.bottom < 0 || r.top > vh || r.right < 0 || r.left > vw) return; // offscreen: skip subtree
        const cs = getComputedStyle(el);
        if (cs.display === "none" || cs.visibility === "hidden") return;
        if (r.width > 2 && r.height > 2 && isLayer(el, cs)) picked.push({ el, r, op: cs.opacity, tf: cs.transform, inline: cs.display === "inline" });
        if (el.tagName.toUpperCase() === "SVG") return; // animate the icon as one piece
        for (const c of el.children) if (c.tagName !== "STYLE" && c.tagName !== "SCRIPT") walk(c);
      };
      for (const c of root.children) if (c.tagName !== "STYLE") walk(c);
      const big = vw * vh * 0.12;
      const side = root.querySelector(".ps-side"), sr = side ? side.getBoundingClientRect() : null;
      const mainLeft = sr && sr.width ? sr.right : 0, mainMid = mainLeft + (vw - mainLeft) / 2;
      picked.forEach(({ el, r, op, tf, inline }) => {
        const delay = 60 + Math.max(0, r.top) / vh * 760 + Math.max(0, r.left) / vw * 280;
        const base = tf && tf !== "none" ? tf : "";
        const area = r.width * r.height;
        // Small pieces glide in from slightly lower-left, a touch larger and blurred, then settle.
        // Big panels move less so the layers don't all slide as one block.
        const k = inline ? 0 : area > big ? 0.35 : 1;
        // Each region enters from its own side: top bar from above, sidebar from the left,
        // the right half of the content from the right, the rest rises from below.
        let dx = 0, dy = 0;
        if (el.closest(".ps-top")) dy = -18;
        else if (el.closest(".ps-side")) dx = -32;
        else if (r.left + r.width / 2 > mainMid) dx = 32;
        else dy = 22;
        const from = { opacity: 0, transform: `${base} translate(${dx * k}px, ${dy * k}px) scale(${1 + 0.04 * k})`.trim() };
        const to = { opacity: op, transform: `${base} translate(0px, 0px) scale(1)`.trim() };
        if (area < 60000) { from.filter = "blur(6px)"; to.filter = "blur(0px)"; }
        try { el.animate([from, to], { duration: 760, delay, easing: "cubic-bezier(.16,.84,.24,1)", fill: "backwards" }); } catch (e) {}
      });
      requestAnimationFrame(finish);
    };
    const check = () => {
      if (cancelled) return;
      const root = document.querySelector(".ps-root");
      const ready = root && root.querySelector(".ps-top");
      if (ready) { if (reduce) finish(); else requestAnimationFrame(() => run(root)); return; }
      if (++tries > 120) return finish(); // ~12s safety: never leave the cover up
      setTimeout(check, 100);
    };
    check();
    return () => { cancelled = true; };
  }, []);
  if (phase === "done") return null;
  return <div className={"ps-open" + (phase === "gone" ? " gone" : "")} aria-hidden="true" />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Gate />);
</script>
</body>
</html>
