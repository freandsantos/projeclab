.ps-top{display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;padding:12px 22px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:10}
.ps-top .ps-logo{font-family:inherit;font-weight:800;font-size:22px;letter-spacing:-.03em;background:none;border:0;padding:0;color:inherit;cursor:pointer;line-height:inherit}
.ps-top .ps-logo:hover{color:var(--accent)}
/* Same size, lighter weight - "Studios" reads as a subtitle, not a second name. */
.ps-top .ps-logo-sub{font-weight:400;font-size:23px;margin-left:.28em}
.ps-spacer{flex:1}
.ps-viewas{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.ps-root select,.ps-root input,.ps-root textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.ps-mode{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
.ps-shell{display:grid;grid-template-columns:210px minmax(0,1fr)}
.ps-side{padding:18px 12px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-height:calc(100vh - 58px)}
.ps-nav{display:flex;align-items:center;text-align:left;background:none;border:0;border-radius:8px;padding:8px 12px;cursor:pointer}
.ps-nav:hover{background:var(--line)}
.ps-nav.on{background:var(--ink);color:var(--paper)}
.ps-count{margin-left:auto;font-size:12px;font-weight:600;opacity:.75}
.ps-clientmenu{position:relative;display:block}
.ps-clientbtn{width:100%;gap:8px}
.ps-clientbtn-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ps-caret{font-size:10px;opacity:.7;margin-left:2px}
.ps-clientpanel{position:absolute;top:calc(100% + 4px);left:0;min-width:232px;max-width:300px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 18px 40px -12px rgba(0,0,0,.35);z-index:40;padding:6px}
.ps-client-search{flex:0 0 auto;width:100%;margin-bottom:5px;padding:6px 9px;font-size:13px}
.ps-client-opts{display:flex;flex-direction:column;gap:1px;max-height:320px;overflow-y:auto;overscroll-behavior:contain}
/* Never let the rows shrink to fit the box - the box scrolls instead. */
.ps-client-opt{flex:0 0 auto;border:0;background:transparent;color:var(--ink);text-align:left;padding:6px 9px;border-radius:7px;cursor:pointer;font-size:14px;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps-client-opt:hover{background:var(--paper)}
.ps-client-opt.on{background:var(--ink);color:var(--paper);font-weight:600}
.ps-client-empty{margin:6px 9px;font-size:13px}
.ps-group{margin:18px 12px 4px;font-size:13px;color:var(--muted)}
.ps-main{padding:34px 40px 80px;max-width:1120px;min-width:0}
.ps-h1{font-size:40px;font-weight:800;letter-spacing:-.035em;line-height:1.05;margin:0 0 8px}
.ps-h2{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:0 0 10px}
.ps-h3{font-size:18px;font-weight:600;margin:30px 0 10px;display:flex;align-items:center;gap:10px}
.ps-lede{color:var(--muted);margin:0 0 22px;max-width:62ch}
.ps-muted{color:var(--muted);font-size:13px;font-weight:400;margin:0}
.ps-empty{color:var(--muted);padding:6px 0;margin:0}
.ps-strip{display:flex;gap:6px;overflow-x:auto;background:var(--film);padding:18px 12px;border-radius:6px;margin-top:12px;
  background-image:radial-gradient(circle,var(--paper) 3px,transparent 3.5px),radial-gradient(circle,var(--paper) 3px,transparent 3.5px);
  background-size:18px 18px,18px 18px;background-position:0 -2px,0 calc(100% + 2px);background-repeat:repeat-x}
.ps-frame{flex:1 0 92px;min-height:104px;background:var(--card);border:2px solid transparent;border-radius:3px;cursor:pointer;
  display:flex;flex-direction:column;align-items:flex-start;padding:0 10px 8px;text-align:left;transition:transform .15s}
.ps-frame:hover{transform:translateY(-2px)}
.ps-frame.on{border-color:var(--accent)}
.ps-frame.empty .ps-frame-n{color:var(--line)}
.ps-frame-bar{align-self:stretch;height:4px;margin:0 -10px 6px}
.ps-frame-n{font-size:32px;font-weight:800;line-height:1;letter-spacing:-.03em}
.ps-frame-name{font-size:12px;line-height:1.25;margin-top:auto;color:var(--muted)}
.ps-frame-step{display:inline-grid;place-content:center;min-width:17px;height:17px;border-radius:50%;background:var(--paper);font-size:10px;font-weight:600;color:var(--muted)}
.ps-client-x{align-self:center}
.ps-confirm-pick{margin:4px 0 14px;max-width:340px}
.ps-confirm-pick select{width:100%}
.ps-invoices{display:flex;flex-direction:column;gap:6px;max-width:560px}
.ps-invoice-row{display:flex;align-items:center;gap:6px}
.ps-job-add{margin-top:10px;max-width:560px}
.ps-job-add input{flex:1;min-width:200px}
.ps-invoice{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);text-align:left;cursor:default}
.ps-invoice.clickable{cursor:pointer}
.ps-invoice.clickable:hover{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.ps-invoice-when{font-size:14px;font-weight:600}
.ps-invoice-state{font-size:12px;color:var(--muted);white-space:nowrap}
.ps-invoice.paid{background:var(--okbg);border-color:transparent}
.ps-invoice.paid .ps-invoice-state{color:var(--accent);font-weight:600}
.ps-invoice.unpaid{border:1px solid var(--late)}
.ps-invoice.unpaid .ps-invoice-state{color:var(--late);font-weight:600}
.ps-invoice.upcoming{border-style:dashed;background:transparent}
.ps-field-na{display:flex;align-items:center;height:37.5px}
.ps-table{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.ps-row{display:grid;grid-template-columns:150px minmax(0,1fr) auto 104px 150px 58px;gap:12px;align-items:center;background:none;border:0;
  border-bottom:1px solid var(--line);padding:11px 6px;text-align:left;cursor:pointer}
.ps-row:hover{background:var(--card)}
.ps-row-client{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ps-row-title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ps-row-ed{display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap;font-size:13px;color:var(--muted)}
.ps-row-go{font-size:13px;color:var(--muted);text-align:right}
.ps-row-go.mine{color:var(--accent);font-weight:600}
.ps-chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--line);color:var(--muted);white-space:nowrap}
.ps-chip.ok,.ps-chip.filmed{background:var(--okbg);color:var(--accent)}
.ps-chip.warn{background:var(--warnbg);color:var(--warn)}
.ps-due{font-size:13px;color:var(--muted);white-space:nowrap}
.ps-due.soon{color:var(--ink);font-weight:600}
.ps-due.late{color:var(--late);font-weight:600}
.ps-fold{margin-top:26px}
.ps-fold summary{cursor:pointer;color:var(--muted);margin-bottom:8px}
.ps-person{margin-top:8px}
.ps-av{display:inline-grid;place-content:center;flex:none;border-radius:50%;object-fit:cover;font-weight:600;background:var(--line);color:var(--muted)}
.ps-who{display:inline-flex;align-items:center;gap:6px;font-size:14px}
.ps-avpick{position:relative;display:inline-flex}
.ps-avpick label{position:relative;display:inline-flex;cursor:pointer;border-radius:50%}
.ps-avpick label:hover .ps-av{filter:brightness(.88)}
.ps-avpick label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.ps-avpen{position:absolute;right:-3px;bottom:-3px;width:20px;height:20px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-content:center;font-size:11px;color:var(--muted)}
.ps-avx{position:absolute;top:-5px;right:-5px;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:13px;line-height:1;cursor:pointer;opacity:0}
.ps-avpick:hover .ps-avx,.ps-avx:focus-visible{opacity:1}
.ps-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ps-profile{display:flex;align-items:center;gap:18px;margin-bottom:8px}
.ps-profile .ps-h1{margin:0}
.ps-editors{display:flex;flex-wrap:wrap;gap:20px}
.ps-editor{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14px}
.ps-todos{display:flex;flex-direction:column;gap:4px;margin-bottom:14px;max-width:720px}
.ps-agecols{display:flex;align-items:flex-end;gap:8px;max-width:900px;margin:4px 0 10px;padding-bottom:2px;border-bottom:1px solid var(--line)}
.ps-agecol{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px;padding:4px 2px 8px;border:0;background:none;font:inherit;color:var(--ink);cursor:pointer;border-radius:6px 6px 0 0}
.ps-agecol:hover{background:var(--paper)}
.ps-agecol-n{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}
.ps-agecol.late .ps-agecol-n{color:var(--late)}
.ps-agecol-plot{display:flex;align-items:flex-end;justify-content:center;width:100%;height:170px}
.ps-agecol-bar{display:block;width:60%;max-width:34px;min-height:4px;border-radius:4px 4px 0 0;background:var(--accent)}
.ps-agecol.late .ps-agecol-bar{background:var(--late)}
.ps-agecol-name{font-size:11px;line-height:1.3;font-weight:600;text-align:center;width:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ps-agecol-who{font-size:10.5px;color:var(--muted);text-align:center;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:900px){
  .ps-agecols{overflow-x:auto;padding-bottom:6px}
  .ps-agecol{flex:0 0 78px}
}
.ps-rowtag{display:inline-block;margin-right:7px;padding:1px 6px;border-radius:5px;background:var(--line);color:var(--muted);font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;vertical-align:1px}
.ps-tgroup{border-bottom:0}
.ps-tgroup > summary{display:flex;align-items:center;gap:10px;cursor:pointer;list-style:none;padding:10px 0 6px;font-weight:600;font-size:14px;color:var(--ink)}
.ps-tgroup > summary::-webkit-details-marker{display:none}
.ps-tgroup > summary::before{content:"▸";color:var(--muted);font-size:11px;transition:transform .12s;display:inline-block}
.ps-tgroup[open] > summary::before{transform:rotate(90deg)}
.ps-tgroup > summary:hover .ps-tgroup-name{color:var(--accent)}
.ps-tgroup-n{color:var(--muted);font-weight:500;font-size:13px}
.ps-tgroup.overdue .ps-tgroup-n{color:var(--late);font-weight:600}
.ps-tgroup.done > summary{color:var(--muted)}
.ps-todo{display:flex;align-items:center;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.ps-todo{align-items:flex-start}
.ps-todo input[type=checkbox]{margin-top:2px}
.ps-todo.done .ps-todo-text{text-decoration:line-through;color:var(--muted)}
.ps-todo input[type=checkbox],.ps-checks input{width:17px;height:17px;accent-color:var(--accent)}
.ps-undo{background:none;border:1px solid var(--line);border-radius:6px;padding:2px 10px;font-size:13px;font-weight:600;color:var(--accent);cursor:pointer}
.ps-undo:hover{border-color:var(--accent)}
.ps-todo.removed{color:var(--muted);font-size:14px}
.ps-todo.removed span{flex:1}
.ps-x-small{background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer;line-height:1;padding:0 4px}
.ps-x-small:hover{color:var(--late)}
.ps-overlay{position:fixed;inset:0;background:rgba(10,14,20,.5);display:flex;align-items:flex-start;justify-content:center;padding:48px 16px;overflow:auto;z-index:20}
.ps-modal{position:relative;background:var(--card);border-radius:12px;padding:28px 30px;width:100%;max-width:680px;box-shadow:0 30px 60px -20px rgba(0,0,0,.4)}
.ps-x{position:absolute;top:14px;right:16px;background:none;border:0;font-size:26px;cursor:pointer;color:var(--muted)}
.ps-bigcal-head{max-width:none;margin-bottom:10px;gap:10px;justify-content:flex-start}
.ps-bigcal-title{font-size:18px}
.ps-today-btn{margin-left:auto;padding:4px 12px}
.ps-bigcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.ps-bigcal-dow{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
.ps-bigcal-blank{min-height:92px;border-radius:9px;background:transparent}
.ps-bigcal-day{display:flex;flex-direction:column;gap:2px;align-items:stretch;min-height:92px;padding:5px 6px;background:var(--card);border:1px solid var(--line);border-radius:9px;cursor:pointer;font:inherit;color:var(--ink);text-align:left;overflow:hidden}
.ps-bigcal-day:hover{border-color:var(--accent)}
.ps-bigcal-day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.ps-bigcal-num{font-size:12px;font-weight:700;color:var(--muted)}
.ps-bigcal-day.today .ps-bigcal-num{color:var(--accent)}
.ps-ev{font-size:10.5px;line-height:1.3;padding:1px 5px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps-ev.off{background:var(--warnbg);color:var(--warn)}
.ps-ev.meet{background:var(--okbg);color:var(--accent);font-weight:600}
.ps-ev.more{color:var(--muted)}
.ps-day-form{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0 6px}
.ps-day-form input,.ps-day-form select{flex:1 1 150px;min-width:0}
.ps-day-time{flex:0 0 130px}
.ps-who-pick{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.ps-who{border:1px solid var(--line);background:var(--paper);color:var(--muted);font:inherit;font-size:12px;padding:3px 9px;border-radius:999px;cursor:pointer}
.ps-who.on{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600}
.ps-hr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px;margin-bottom:20px}
.ps-hr-card{display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;cursor:pointer;font:inherit;color:var(--ink)}
.ps-hr-card:hover{border-color:var(--accent)}
.ps-hr-main{display:flex;flex-direction:column;min-width:0;flex:1}
.ps-hr-main .ps-muted{font-size:12px}
.ps-hr-chips{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.ps-hr-chips .ps-chip{font-size:11px;padding:1px 7px}
.ps-person-head{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.ps-person-head .ps-h2{margin:0 0 2px}
.ps-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.ps-tab{border:0;background:none;color:var(--muted);font:inherit;font-weight:600;padding:7px 11px;border-radius:8px 8px 0 0;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.ps-tab:hover{color:var(--ink)}
.ps-tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.ps-tabbody{min-height:150px}
.ps-away-form{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0 12px}
.ps-away-form .ps-duo{flex:0 1 290px}
.ps-away-form input{flex:1 1 150px;min-width:0}
.ps-away-row{display:flex;align-items:center;gap:10px;padding:7px 10px;background:var(--paper);border:1px solid var(--line);border-radius:8px;margin-bottom:6px}
.ps-allow{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin:10px 0 4px;padding:10px 12px;background:var(--paper);border:1px solid var(--line);border-radius:9px}
.ps-allow input{width:92px}
.ps-allow-sum{display:flex;flex-direction:column;gap:1px;font-size:13px;padding-bottom:2px}
.ps-balance{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 14px}
.ps-bal-card{flex:1 1 130px;display:flex;flex-direction:column;gap:2px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.ps-bal-card.big{border-color:var(--accent);flex:1 1 160px}
.ps-bal-n{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--accent)}
.ps-bal-n.small{font-size:26px;color:var(--ink)}
.ps-bal-l{font-size:12px;color:var(--muted)}
.ps-req{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:var(--card);max-width:720px}
.ps-req-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:8px}
.ps-req-acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ps-req-acts input{flex:1 1 200px;min-width:0}
.ps-away-row span:first-child{flex:1;min-width:0}
.ps-qa-big{font-size:34px;font-weight:800;letter-spacing:-.02em;margin-bottom:2px}
.ps-qa-big .ps-muted{font-size:15px;font-weight:600;letter-spacing:0}
.ps-qa-bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin:12px 0}
.ps-qa-bar span{display:block;height:100%;background:var(--accent)}
.ps-qa-note{margin-top:14px;font-size:13px}
.ps-note-in{width:100%;min-width:0;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);resize:vertical}
.ps-note-row{border-top:1px solid var(--line);padding-top:8px;margin-top:10px}
.ps-note-meta{display:flex;align-items:center;gap:6px;font-size:12px;margin:0 0 3px}
.ps-note-meta .ps-x-small{margin-left:auto}
.ps-note-text{margin:0;white-space:pre-wrap}
.ps-title-in{width:100%;font-size:26px!important;font-weight:800;letter-spacing:-.02em;border:1px dashed transparent!important;padding:2px 4px!important;margin:2px 0 10px -4px}
.ps-title-in:hover{border-color:var(--line)!important}
.ps-meta{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:12px}
.ps-notebox{border-left:3px solid var(--accent);background:var(--paper);padding:10px 14px;border-radius:0 8px 8px 0;margin:14px 0}
.ps-notebox p{margin:4px 0 0;white-space:pre-wrap}
.ps-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ps-field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.ps-field input,.ps-field select{color:var(--ink)}
.ps-actions{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.ps-actions textarea{width:100%;min-height:74px;resize:vertical}
.ps-checks{border:1px solid var(--line);border-radius:8px;padding:10px 14px 12px;margin:0 0 14px;display:flex;flex-direction:column;gap:8px}
.ps-checks legend{font-size:13px;color:var(--muted);padding:0 4px}
.ps-checks label{display:flex;align-items:center;gap:10px;cursor:pointer}
.ps-warn{color:var(--late);font-size:14px;margin:0 0 10px}
.ps-btnrow{display:flex;justify-content:space-between;gap:10px;margin-top:10px}
.ps-btnrow.end{justify-content:flex-end}
.ps-btn{background:var(--accent);color:#fff!important;border:0;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer}
.ps-root.dark .ps-btn:not(.ghost):not(.danger){color:#06201D!important}
.ps-btn.ghost{background:none;color:var(--ink)!important;border:1px solid var(--line)}
.ps-btn.danger{background:var(--late);color:#fff!important;border:1px solid var(--late)}
.ps-root.dark .ps-btn.danger{color:#2A0A07!important}
.ps-confirm{max-width:420px;padding:24px 26px}
.ps-confirm-line{margin:6px 0 0}
.ps-confirm-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.ps-btn:disabled{opacity:.4;cursor:not-allowed}
.ps-history{margin-top:20px;font-size:14px}
.ps-history summary{cursor:pointer;color:var(--muted)}
.ps-history ul{padding-left:18px;margin:8px 0 0}
.ps-history li{margin:3px 0}
.ps-form{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ps-form input:not([type=date]){min-width:240px}
.ps-clients{display:flex;flex-direction:column;gap:10px;max-width:780px}
.ps-client-row{display:grid;grid-template-columns:minmax(110px,1fr) 150px 150px 170px 26px;gap:12px;align-items:end;padding-bottom:10px;border-bottom:1px solid var(--line)}
.ps-client-row .ps-field select,.ps-client-row .ps-pickerwrap input{width:100%;box-sizing:border-box}
.ps-client-row .ps-pickerwrap{display:block;width:100%}

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;
/* ================================================================
   STEP: paste your two Supabase values between the quotes below.
   Find them in Supabase: Project Settings → API.
   ================================================================ */
const SUPABASE_URL = "https://yuetvdhfbxnmrfdmnsod.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_E2cTTgTNiMP-rOhAm6tSyw_IhenR-Q0";

const CONFIGURED = SUPABASE_URL.startsWith("https://") && !SUPABASE_ANON_KEY.startsWith("PASTE");
const sb = CONFIGURED ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

/* Shared saving: everyone reads and writes the same row in Supabase */
if (sb) {
  window.storage = {
    get: async key => {
      const { data, error } = await sb.from("app_state").select("value").eq("key", key).maybeSingle();
      if (error) throw error;
      return data ? { key, value: data.value } : null;
    },
    set: async (key, value) => {
      const { error } = await sb.from("app_state").upsert({ key, value, updated_at: new Date().toISOString() });
      if (error) throw error;
      return { key, value };
    },
    subscribe: (key, cb) => {
      const refresh = async () => {
        try { const r = await window.storage.get(key); if (r) cb(r.value); } catch (e) { console.error(e); }
      };
      const ch = sb.channel("app_state_changes")
        .on("postgres_changes", { event: "*", schema: "public", table: "app_state" }, p => {
          if (!p.new || p.new.key === key) refresh();
        })
        .subscribe();
      window.addEventListener("focus", refresh);
      const timer = setInterval(refresh, 30000);
      return () => { sb.removeChannel(ch); window.removeEventListener("focus", refresh); clearInterval(timer); };
    },
  };
}

.gt button:disabled{opacity:.5}
.gt .err{color:#B42318}
.gt code{background:#EDF0F3;padding:2px 6px;border-radius:4px}
`;

function Gate() {
  const [session, setSession] = useState(undefined);
  const [allowed, setAllowed] = useState(null);
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");

  useEffect(() => {
    if (!sb) return;
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data } = sb.auth.onAuthStateChange((_event, s) => setSession(s));
    return () => data.subscription.unsubscribe();
  }, []);
  useEffect(() => {
    if (!sb || !session) { setAllowed(null); return; }
    sb.rpc("is_team_member").then(({ data, error }) => setAllowed(!error && data === true));
  }, [session]);

  const signOut = async () => { await sb.auth.signOut(); window.cutlineAuth = null; setPassword(""); };
  const send = async () => {
    setErr("");
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email.trim())) { setErr("Type a full email address, like name@company.com."); return; }
    if (!password) { setErr("Type your password."); return; }
    setBusy(true);
    const { error } = await sb.auth.signInWithPassword({ email: email.trim().toLowerCase(), password });
    setBusy(false);
    if (error) {
      const m = (error.message || "").toLowerCase();
      if (m.includes("invalid login")) setErr("That email and password don't match. Check for typos, or ask your team lead to reset it.");
      else if (m.includes("confirm")) setErr("This account hasn't been confirmed yet. Ask your team lead to tick 'Auto Confirm User' in Supabase.");
      else setErr(error.message);
    }
  };

  const box = children => <div className="gt"><style>{GATE_CSS}</style><div className="gt-box">{children}</div></div>;

  if (!sb) return box(<><h1>Almost there</h1><p>Open <code>index.html</code> and paste your Supabase Project URL and anon public key near the top of the file.</p></>);
  if (session === undefined || (session && allowed === null)) return box(<p>Loading…</p>);
  if (!session) return box(
    <><h1>Projeclab Studios</h1><p>Sign in with your work email and password.</p>
      <input type="email" placeholder="you@company.com" value={email} onChange={e => setEmail(e.target.value)}
        onKeyDown={e => e.key === "Enter" && send()} autoFocus />
      <input type="password" placeholder="Password" value={password} onChange={e => setPassword(e.target.value)}
        onKeyDown={e => e.key === "Enter" && send()} />
      <button onClick={send} disabled={busy}>{busy ? "Signing in…" : "Sign in"}</button>
      {err && <p className="err" style={{ marginTop: 10 }}>{err}</p>}
      <p style={{ marginTop: 14, fontSize: 13 }}>Forgotten it? Ask your team lead to set a new one for you in Supabase.</p></>
  );
  if (!allowed) return box(<><h1>Not on the team list</h1><p><b>{session.user.email}</b> isn't allowed in yet. Ask your team lead to add this email in Supabase.</p>
    <button onClick={signOut}>Sign out</button></>);

  window.cutlineAuth = { email: session.user.email, signOut };
  return <ProjeclabStudios />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Gate />);
</script>
</body>
</html>
